# Production stack for a single VPS: Postgres, the API, the frontend, and
# Caddy terminating TLS in front of both.
#
# Caddy serves the API and the site from ONE origin (/api/* to the API,
# everything else to Next.js). That is not cosmetic: on Render they were two
# origins, which is why every stalled response showed up in the browser as a
# CORS error. Same origin, no preflight, no CORS.
#
# Run from this directory:  docker compose up -d --build

name: sijill

services:
  postgres:
    # 18 to match Render's server version -- pg_restore refuses a dump made by
    # a newer pg_dump than the target, and the old database reports 18.4.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGDATABASE}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      # /var/lib/postgresql, NOT /var/lib/postgresql/data: from 18 the image
      # keeps data in a major-version subdirectory and refuses to start if it
      # finds a volume mounted at the old path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${PGDATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 12
    # Deliberately no `ports:` -- the database is reachable from the other
    # containers and from nothing else. Use `docker compose exec postgres psql`
    # rather than opening 5432 to the internet.

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      default:
        aliases: [sijill-minio]
    # No ports: the API reaches it over the compose network, and the public
    # read path goes through Caddy. Only the attachment bucket is given
    # anonymous read; the backup bucket stays private and is reached solely by
    # the API with credentials.

  translator:
    # Private, self-hosted translation for the short Arabic/English/Hindi
    # labels entered in forms. No published port and no third-party quota.
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: ar,en,hi
      LT_DISABLE_WEB_UI: "true"
    volumes:
      # Keep downloaded Argos models across image/container updates.
      - translator-models:/home/libretranslate/.local:rw
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 20
      # The first deployment downloads the three language models. Later
      # starts reuse the volume and become healthy much faster.
      start_period: 10m
    # A translation helper must never be able to starve the hospital app.
    mem_limit: 2g
    cpus: 1.5
    networks:
      default:
        aliases: [sijill-translator]

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      translator:
        condition: service_healthy
    environment:
      # An OutOfMemoryError kills the Tomcat acceptor threads but leaves the
      # JVM running, so the container stays "up" while answering nothing and
      # every request hangs until Caddy times out -- the site reads as slow
      # rather than down, and `restart: unless-stopped` never fires. Exiting
      # on OOM turns that into a restart measured in seconds.
      # MaxRAMPercentage replaces the default quarter-of-the-box heap: this
      # container is one of five on an 8GB host.
      # Dockerfile gives each dump a unique timestamped name in this persistent
      # directory, so a container recreation cannot erase the evidence again.
      JAVA_OPTS: "-XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=35 -XX:+HeapDumpOnOutOfMemoryError"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PGDATABASE}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: production
      FRONTEND_ORIGIN: https://${SIJILL_DOMAIN}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      JWT_ACCESS_TOKEN_EXPIRY_MINUTES: "60"
      # Object storage: MinIO on this machine once the objects have been
      # mirrored and the stored URLs rewritten (see README step 8). Until then
      # these still point at Supabase, and both work with forcePathStyle.
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_BACKUP_BUCKET: ${OBJECT_STORAGE_BACKUP_BUCKET}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY}
      OBJECT_STORAGE_PUBLIC_URL_BASE: ${OBJECT_STORAGE_PUBLIC_URL_BASE}
      TRANSLATION_HELPER_ENABLED: ${TRANSLATION_HELPER_ENABLED:-false}
      TRANSLATION_PROVIDER: ${TRANSLATION_PROVIDER:-anthropic}
      TRANSLATION_API_KEY: ${TRANSLATION_API_KEY:-}
      NAME_TRANSLATION_BASE_URL: http://sijill-translator:5000
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - api-heap-dumps:/heap-dumps
    networks:
      default:
        # Caddy also joins a network containing IRAPP's `api` service. Always
        # use this unique name so a container restart cannot redirect Riyadh
        # traffic to the other application.
        aliases: [sijill-api]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      # Generous: the JVM starts in well under a minute here, but a start
      # period that is too tight is what turned a slow boot into a restart
      # loop on the old host.
      start_period: 120s
      retries: 3

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        # Same origin as the site itself -- see the Caddy note above.
        NEXT_PUBLIC_API_URL: https://${SIJILL_DOMAIN}/api/v1
        NEXT_PUBLIC_QR_BASE_URL: https://${SIJILL_DOMAIN}/public/assets
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default:
        aliases: [sijill-frontend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SIJILL_DOMAIN: ${SIJILL_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing them, and
      # Let's Encrypt rate-limits that.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - frontend
    networks:
      - default
      - edge

volumes:
  postgres-data:
  minio-data:
  api-heap-dumps:
  caddy-data:
  caddy-config:
  translator-models:

# The host has one public reverse proxy. IRAPP joins this network but never
# publishes ports 80/443 itself.
networks:
  edge:
    external: true
