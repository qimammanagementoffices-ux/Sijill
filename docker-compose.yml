# Local development stack.
#
#   docker compose up -d                        # Postgres + MinIO only, for
#                                               # running the app from an IDE
#   docker compose --profile app up -d --build  # everything, no JDK needed
#
# The `app` profile builds the API and frontend in containers, so a machine
# with only Docker installed can run the whole system -- there is no Gradle
# wrapper in this repo, and building the backend natively would need both a
# JDK and Gradle.
#
# Postgres is 16 here against 18 in production (infra/vps). That gap only
# matters for restoring a production dump: pg_restore refuses a dump made by
# a newer pg_dump; the image below is already 18 to match.
services:
  postgres:
    # 18 to match production: pg_restore refuses a dump made by a newer
    # pg_dump, and production reports 18.6.
    image: postgres:18
    container_name: sijill-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sijill
      POSTGRES_USER: sijill
      POSTGRES_PASSWORD: sijill_local_dev
    ports:
      - "5432:5432"
    volumes:
      # /var/lib/postgresql, NOT .../data: from 18 the image keeps data in a
      # major-version subdirectory and refuses to start on the old path.
      - sijill-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sijill -d sijill"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: sijill-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sijill_minio
      MINIO_ROOT_PASSWORD: sijill_minio_local_dev
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - sijill-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- `app` profile: the whole system in containers -------------------------
  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sijill-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: sijill
      DATABASE_USERNAME: sijill
      DATABASE_PASSWORD: sijill_local_dev
      PORT: "8080"
      # Local secrets only. Never reuse these values on the VPS.
      JWT_SIGNING_SECRET: local_dev_signing_secret_change_me_0123456789abcdef
      JWT_ACCESS_TOKEN_EXPIRY_MINUTES: "600"
      FRONTEND_ORIGIN: http://localhost:3000
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_BUCKET: sijill-public
      OBJECT_STORAGE_BACKUP_BUCKET: sijill-private
      OBJECT_STORAGE_ACCESS_KEY: sijill_minio
      OBJECT_STORAGE_SECRET_KEY: sijill_minio_local_dev
      # Browser-facing, so localhost rather than the compose hostname.
      OBJECT_STORAGE_PUBLIC_URL_BASE: http://localhost:9000/sijill-public

  # No frontend service: Next bakes NEXT_PUBLIC_API_URL at build time for the
  # browser, so a containerised frontend would need "localhost:8080" for the
  # browser and "api:8080" for its own server-side rendering -- one variable,
  # two required values. Run the UI on the host instead (npm run dev), where
  # both share the same localhost, and get hot reload as well. See
  # docs/local-development.md.

volumes:
  sijill-postgres-data:
  sijill-minio-data:
