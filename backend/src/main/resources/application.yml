# no-op touch: verifying RENDER_DEPLOY_HOOK_BACKEND CI-gated deploy
spring:
  application:
    name: sijill-api

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # A request that hangs for a minute and then fails leaves nothing in the
      # log to explain itself. These two make the next one say why:
      # leak-detection logs the stack trace of whoever held a connection too
      # long, and the shorter timeout turns a starved pool into a prompt error
      # instead of a 30s stall the user reads as a broken page.
      leak-detection-threshold: 20000
      connection-timeout: 15000

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    signing-secret: ${JWT_SIGNING_SECRET}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:60}
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    # Public bucket for normal attachments. Keep OBJECT_STORAGE_BUCKET as the
    # established name so existing deployments and stored attachment URLs do
    # not change during the backup-bucket rollout.
    bucket: ${OBJECT_STORAGE_BUCKET}
    # Private bucket for database dumps. The fallback keeps an older deploy
    # bootable while Render's environment is being updated; production must
    # set this to the new private bucket before creating another backup.
    backup-bucket: ${OBJECT_STORAGE_BACKUP_BUCKET:${OBJECT_STORAGE_BUCKET}}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
    # Public read URL prefix for the bucket — Supabase Storage serves public
    # buckets at {project}/storage/v1/object/public/{bucket}/{key}, distinct
    # from the S3 API endpoint used for uploads/deletes.
    public-url-base: ${OBJECT_STORAGE_PUBLIC_URL_BASE}
  translation:
    enabled: ${TRANSLATION_HELPER_ENABLED:false}
    provider: ${TRANSLATION_PROVIDER:}
    api-key: ${TRANSLATION_API_KEY:}
    model: ${TRANSLATION_MODEL:claude-haiku-4-5-20251001}
  backup:
    storage-location: ${BACKUP_STORAGE_LOCATION:}
    retention-days: ${BACKUP_RETENTION_DAYS:30}

management:
  health:
    # Render's health check gives /actuator/health a fixed 5s budget. Spring's
    # default DB indicator borrows a Hikari connection and runs a validation
    # query -- when the pool is saturated it blocks up to connectionTimeout
    # (30s), so a busy-but-healthy instance gets killed and restarted. Health
    # here answers "is this process serving HTTP", which is the only question
    # a restart can fix; a database outage is not cured by bouncing the app.
    db:
      enabled: false

logging:
  level:
    root: INFO
    sa.sijill: DEBUG
  # Structured logs, no personal data or credentials — enforced by never logging request/response
  # bodies for auth or employee endpoints; see docs/api-conventions.md.
