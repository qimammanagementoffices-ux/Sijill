spring:
  application:
    name: sijill-api

  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, never by Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    signing-secret: ${JWT_SIGNING_SECRET}
    access-token-expiry-minutes: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:60}
    refresh-token-expiry-days: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:14}
  object-storage:
    endpoint: ${OBJECT_STORAGE_ENDPOINT}
    region: ${OBJECT_STORAGE_REGION:us-east-1}
    bucket: ${OBJECT_STORAGE_BUCKET}
    access-key: ${OBJECT_STORAGE_ACCESS_KEY}
    secret-key: ${OBJECT_STORAGE_SECRET_KEY}
  translation:
    enabled: ${TRANSLATION_HELPER_ENABLED:false}
    provider: ${TRANSLATION_PROVIDER:}
    api-key: ${TRANSLATION_API_KEY:}
  backup:
    storage-location: ${BACKUP_STORAGE_LOCATION:}
    retention-days: ${BACKUP_RETENTION_DAYS:30}

logging:
  level:
    root: INFO
    sa.sijill: DEBUG
  # Structured logs, no personal data or credentials — enforced by never logging request/response
  # bodies for auth or employee endpoints; see docs/api-conventions.md.
