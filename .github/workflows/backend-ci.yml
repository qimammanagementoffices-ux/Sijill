name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned to match backend/Dockerfile's build stage (gradle:8.10-jdk21-alpine).
      # Spring Boot Gradle plugin 3.3.2's bootJar task calls a CopyProcessingSpec
      # API that Gradle 9+ removed, so the action's default (latest Gradle)
      # breaks the build — see run 31168076239 for the failure.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build and test
        run: gradle build --no-daemon

# Deploying is vps-deploy.yml's job now; it watches this workflow and runs on
# success. The gate is the same one render.yaml's autoDeploy: false enforced --
# a commit that fails tests never reaches the server.
