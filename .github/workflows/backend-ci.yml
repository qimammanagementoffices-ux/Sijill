name: backend-ci

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Pinned to match backend/Dockerfile's build stage (gradle:8.10-jdk21-alpine).
      # Spring Boot Gradle plugin 3.3.2's bootJar task calls a CopyProcessingSpec
      # API that Gradle 9+ removed, so the action's default (latest Gradle)
      # breaks the build — see run 31168076239 for the failure.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build and test
        run: gradle build --no-daemon

  # Render used to auto-deploy on every push to main independently of this
  # workflow's result (see docs/deployment-runbook.md section 2) -- a commit
  # that broke tests could still ship. render.yaml now sets
  # autoDeploy: false for sijill-api, so this is the only thing that
  # triggers a deploy: only after `build` succeeds, and only on main.
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_BACKEND secret not set -- skipping deploy trigger."
            echo "See docs/deployment-runbook.md section 2 for setup."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
