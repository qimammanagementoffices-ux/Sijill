# Deploys to the VPS after CI passes.
#
# Triggered by the single CI workflow rather than either half independently.
# Both backend and frontend must pass before the complete commit reaches the
# server; a green frontend can no longer deploy a red backend.
name: vps-deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # Emergency/manual redeploy of the current main commit.
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on failure too; only a green run may deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # One step, because the `secrets` context is not available to step-level
      # `if:` conditions -- guarding there would look right and do nothing.
      - name: Build and restart on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '~/Sijill' }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST is not set -- skipping deploy. See infra/vps/README.md."
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key rather than trusting whatever answers first.
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            APP_DIR="$APP_DIR" bash -euo pipefail -s << 'REMOTE'
            cd "$APP_DIR"
            git fetch --prune origin
            # The server's checkout is a deploy artifact, not a workspace:
            # match origin/main exactly rather than trying to merge.
            git reset --hard origin/main
            cd infra/vps
            docker compose up -d --build
            # A mounted but unwritable directory would fail only during the
            # next OOM, when it is too late to recover the evidence.
            docker compose exec -T api sh -c 'test -w /heap-dumps'
            # Caddy resolves api:8080 and holds on to the address. Rebuilding
            # the API gives it a new container IP, and Caddy keeps proxying to
            # the old one -- a healthy app behind a 502/503 until Caddy is
            # recreated. Git replaces the bind-mounted Caddyfile atomically,
            # so a restart can keep the old file mount and stale routes.
            # Recreating only Caddy remounts the current configuration; its
            # certificates live in a named volume and survive the operation.
            docker compose up -d --force-recreate caddy
            # Old image layers accumulate fast under a JVM base image.
            docker image prune -f
          REMOTE

      - name: Confirm the site answers
        env:
          SIJILL_URL: ${{ secrets.SIJILL_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SIJILL_URL:-}" ]; then
            echo "SIJILL_URL is not set -- skipping the health check."
            exit 0
          fi
          # The API restarts as part of the deploy; give it room to come up
          # before calling the deploy broken.
          for attempt in $(seq 1 20); do
            # Follow the HTTP-to-HTTPS redirect. Without --location, Caddy's
            # 308 redirect counted as healthy even when TLS itself was down.
            if curl --location --proto-redir =https -fsS -m 10 "$SIJILL_URL/api/v1/i18n/locales" > /dev/null; then
              echo "Deploy is live."
              exit 0
            fi
            echo "Attempt $attempt: not up yet."
            sleep 15
          done
          echo "The site did not answer within five minutes."
          exit 1

      - name: Confirm the legacy IRAPP address redirects
        run: |
          set -euo pipefail
          # Give Caddy time to provision/renew the legacy hostname's
          # certificate, then require the redirect's final HTTPS response.
          for attempt in $(seq 1 10); do
            if curl --location --proto-redir =https -fsS -m 10 \
              "https://irapp.sijill.digital/api/v1/i18n/locales" > /dev/null; then
              echo "Legacy IRAPP address is live."
              exit 0
            fi
            echo "Attempt $attempt: legacy IRAPP address is not up yet."
            sleep 15
          done
          echo "The legacy IRAPP address did not answer within 150 seconds."
          exit 1

      - name: Show proxy diagnostics after a failed health check
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '~/Sijill' }}
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST" ] || exit 0
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            APP_DIR="$APP_DIR" bash -euo pipefail -s << 'REMOTE'
            cd "$APP_DIR/infra/vps"
            docker compose ps
            docker compose logs --tail=200 caddy
          REMOTE
