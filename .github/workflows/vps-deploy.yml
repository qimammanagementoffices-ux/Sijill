# Deploys to the VPS after CI passes.
#
# Triggered by the single CI workflow rather than either half independently.
# Both backend and frontend must pass before the complete commit reaches the
# server; a green frontend can no longer deploy a red backend.
name: vps-deploy

on:
  workflow_run:
    workflows: ["ci"]
    types: [completed]
    branches: [main]
  # Emergency/manual redeploy of the current main commit.
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on failure too; only a green run may deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # One step, because the `secrets` context is not available to step-level
      # `if:` conditions -- guarding there would look right and do nothing.
      - name: Build and restart on the server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '~/Sijill' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ]; then
            echo "VPS_HOST is not set -- skipping deploy. See infra/vps/README.md."
            exit 0
          fi

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pin the host key rather than trusting whatever answers first.
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # The server checkout uses HTTPS and intentionally stores no GitHub
          # credential. Supply this run's short-lived, read-only token only to
          # the fetch command; do not write it into the remote or credential
          # configuration.
          GIT_AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            GIT_AUTH_HEADER="$GIT_AUTH_HEADER" APP_DIR="$APP_DIR" bash -euo pipefail -s << 'REMOTE'
            cd "$APP_DIR"
            git -c http.extraheader="Authorization: Basic $GIT_AUTH_HEADER" fetch --prune origin
            unset GIT_AUTH_HEADER
            # The server's checkout is a deploy artifact, not a workspace:
            # match origin/main exactly rather than trying to merge.
            git reset --hard origin/main
            cd infra/vps
            # Validate the candidate while the current proxy is still intact.
            # A syntax error must never replace the known-good live config.
            docker compose exec -T caddy sh -c 'cat > /tmp/Sijill-Caddyfile-candidate' < Caddyfile
            docker compose exec -T caddy caddy validate \
              --config /tmp/Sijill-Caddyfile-candidate --adapter caddyfile < /dev/null
            echo "Candidate proxy config validated; continuing deployment."
            # One public proxy serves both Compose projects. The IR stack was
            # originally attached with generic Docker DNS names (`api` and
            # `auth`), which collide with this stack after either app is
            # recreated. Expand the running IR endpoints with stable aliases
            # before Caddy starts using them. Future IR deploys declare the
            # same aliases in their Compose file, so this is idempotent.
            docker network inspect edge >/dev/null 2>&1 || docker network create edge
            ensure_ir_alias() {
              service="$1"
              alias="$2"
              container_id=$(docker ps \
                --filter 'label=com.docker.compose.project=irdept' \
                --filter "label=com.docker.compose.service=$service" \
                --format '{{.ID}}' | head -n 1)
              if [ -z "$container_id" ]; then
                echo "IRAPP service '$service' is not running."
                return 1
              fi
              if docker inspect --format '{{json (index .NetworkSettings.Networks "edge").Aliases}}' "$container_id" \
                  | grep -Fq "\"$alias\""; then
                echo "IRAPP alias '$alias' is already present."
                return 0
              fi
              docker network disconnect edge "$container_id"
              if ! docker network connect --alias "$alias" edge "$container_id"; then
                # Restore connectivity even if adding the alias failed.
                docker network connect edge "$container_id" || true
                return 1
              fi
              echo "Added IRAPP alias '$alias'."
            }
            ensure_ir_alias auth irapp-auth
            ensure_ir_alias api irapp-api
            docker compose up -d --build --remove-orphans
            # Prove the model itself works, not merely that the HTTP process
            # opened a port. Exercise every direction the form uses; all text
            # is synthetic and contains no user data.
            docker compose exec -T translator ./venv/bin/python - <<'PY'
          import time

          import requests

          pairs = (
              ("test", "en", "ar"),
              ("test", "en", "hi"),
              ("اختبار", "ar", "en"),
              ("اختبار", "ar", "hi"),
              ("परीक्षण", "hi", "en"),
              ("परीक्षण", "hi", "ar"),
          )
          deadline = time.monotonic() + 300
          last_error = None

          while time.monotonic() < deadline:
              try:
                  for query, source, target in pairs:
                      response = requests.post(
                          "http://localhost:5000/translate",
                          json={
                              "q": query,
                              "source": source,
                              "target": target,
                              "format": "text",
                          },
                          timeout=30,
                      )
                      response.raise_for_status()
                      if not response.json().get("translatedText"):
                          raise RuntimeError("Translation result was empty.")
                  break
              except (requests.RequestException, RuntimeError, ValueError) as error:
                  last_error = error
                  print("Translation model is still starting; retrying in 5 seconds.")
                  time.sleep(5)
          else:
              raise RuntimeError(
                  "Translation model did not become ready within 5 minutes."
              ) from last_error
          PY
            echo "Private translation model is healthy."
            # A mounted but unwritable directory would fail only during the
            # next OOM, when it is too late to recover the evidence.
            docker compose exec -T api sh -c 'test -w /heap-dumps' < /dev/null
            # Caddy resolves api:8080 and holds on to the address. Rebuilding
            # the API gives it a new container IP, and Caddy keeps proxying to
            # the old one -- a healthy app behind a 502/503 until Caddy is
            # reloaded. Git replaces the bind-mounted Caddyfile atomically, so
            # the running container can retain the old file mount. Stream the
            # current file into the container and use Caddy's admin API for a
            # zero-downtime reload instead of relying on container recreation.
            docker compose exec -T caddy sh -c 'cat > /tmp/Sijill-Caddyfile' < Caddyfile
            docker compose exec -T caddy caddy reload \
              --config /tmp/Sijill-Caddyfile --adapter caddyfile < /dev/null
            echo "Proxy reload completed."
            # Old image layers accumulate fast under a JVM base image.
            docker image prune -f
          REMOTE

      - name: Confirm both sites answer
        env:
          SIJILL_URL: ${{ secrets.SIJILL_URL || 'https://riyadh.sijill.digital' }}
          IRAPP_URL: https://irapp.sijill.digital
        run: |
          set -euo pipefail
          # The API restarts as part of the deploy; give it room to come up
          # before calling the deploy broken.
          sijill_live=false
          for attempt in $(seq 1 20); do
            # Follow the HTTP-to-HTTPS redirect. Without --location, Caddy's
            # 308 redirect counted as healthy even when TLS itself was down.
            if curl --location --proto-redir =https -fsS -m 10 "$SIJILL_URL/api/v1/i18n/locales" > /dev/null; then
              echo "Sijill is live."
              sijill_live=true
              break
            fi
            echo "Attempt $attempt: not up yet."
            sleep 15
          done
          if [ "$sijill_live" != true ]; then
            echo "Sijill did not answer within five minutes."
            exit 1
          fi

          for attempt in $(seq 1 20); do
            if curl --location --proto-redir =https -fsS -m 10 "$IRAPP_URL/auth/v1/health" > /dev/null; then
              echo "IRAPP is live."
              exit 0
            fi
            echo "IRAPP attempt $attempt: not up yet."
            sleep 15
          done
          echo "IRAPP did not answer within five minutes."
          exit 1

      - name: Show proxy diagnostics after a failed health check
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          APP_DIR: ${{ secrets.VPS_APP_DIR || '~/Sijill' }}
        run: |
          set -euo pipefail
          [ -n "$VPS_HOST" ] || exit 0
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            APP_DIR="$APP_DIR" bash -euo pipefail -s << 'REMOTE'
            cd "$APP_DIR/infra/vps"
            docker compose ps
            docker compose logs --tail=200 translator api caddy
          REMOTE
