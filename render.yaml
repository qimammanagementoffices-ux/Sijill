databases:
  - name: sijill-postgres
    plan: free
    databaseName: sijill
    user: sijill

services:
  - type: web
    name: sijill-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    # Was auto-deploying on every push to main independently of
    # backend-ci.yml's result (see deployment-runbook.md section 2) -- a
    # commit that failed tests could still ship. Deploys are now triggered
    # only by backend-ci.yml's `deploy` job, which runs after `build`
    # succeeds. Requires RENDER_DEPLOY_HOOK_BACKEND (this service's Deploy
    # Hook URL, from Settings -> Deploy Hook) set as a GitHub Actions
    # secret -- until that's set, pushes to main build/test but do NOT
    # deploy; use "Manual Deploy" in the Render dashboard in the meantime.
    autoDeploy: false
    envVars:
      # Render's `connectionString` property is a plain postgres:// URI, not the
      # jdbc:postgresql:// form Spring/Hikari requires — build it from parts instead.
      - key: PGHOST
        fromDatabase:
          name: sijill-postgres
          property: host
      - key: PGPORT
        fromDatabase:
          name: sijill-postgres
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: sijill-postgres
          property: database
      # NOT fromDatabase: Render's `property: user` always resolves to the
      # database's original owner role, even after creating a new default
      # credential via the dashboard's "Credentials" rotation feature — it
      # does not track which credential is actually active for new
      # connections. That mismatch took the API down (role stuck on
      # NOLOGIN) on 2026-08-07. Set these manually in the Render dashboard
      # (sijill-api service -> Environment) to match whichever credential
      # is currently the database's active one.
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://sijill-frontend.onrender.com
      - key: JWT_SIGNING_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRY_MINUTES
        value: "60"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: us-east-1
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      # Public read URL prefix for the bucket, distinct from the S3 API
      # endpoint above — e.g. for Supabase Storage:
      # https://<project-ref>.supabase.co/storage/v1/object/public
      - key: OBJECT_STORAGE_PUBLIC_URL_BASE
        sync: false
      # Off by default -- the admin "add language" feature (Phase 9) needs
      # TRANSLATION_API_KEY set manually before it's usable; flip this to
      # "true" once that's done. TRANSLATION_PROVIDER only supports
      # "anthropic" today (AnthropicTranslationAiClient).
      - key: TRANSLATION_HELPER_ENABLED
        value: "false"
      - key: TRANSLATION_PROVIDER
        value: anthropic
      - key: TRANSLATION_API_KEY
        sync: false
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: SPRING_PROFILES_ACTIVE
        value: production

  - type: web
    name: sijill-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    # See sijill-api's autoDeploy comment above -- same reasoning. Requires
    # RENDER_DEPLOY_HOOK_FRONTEND as a GitHub Actions secret.
    autoDeploy: false
    envVars:
      # Render service URLs are deterministic (https://<name>.onrender.com) once
      # this blueprint is deployed under these service names. Update both if you
      # rename a service or attach a custom domain.
      - key: NEXT_PUBLIC_API_URL
        value: https://sijill-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_QR_BASE_URL
        value: https://sijill-frontend.onrender.com/public/assets
