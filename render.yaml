databases:
  - name: sijill-postgres
    plan: free
    databaseName: sijill
    user: sijill

services:
  - type: web
    name: sijill-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sijill-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: sijill-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: sijill-postgres
          property: password
      - key: JWT_SIGNING_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRY_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_EXPIRY_DAYS
        value: "14"
      - key: OBJECT_STORAGE_ENDPOINT
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: us-east-1
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_SECRET_KEY
        sync: false
      - key: TRANSLATION_HELPER_ENABLED
        value: "false"
      - key: BACKUP_RETENTION_DAYS
        value: "30"
      - key: SPRING_PROFILES_ACTIVE
        value: production

  - type: web
    name: sijill-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # Render service URLs are deterministic (https://<name>.onrender.com) once
      # this blueprint is deployed under these service names. Update both if you
      # rename a service or attach a custom domain.
      - key: NEXT_PUBLIC_API_URL
        value: https://sijill-api.onrender.com/api/v1
      - key: NEXT_PUBLIC_QR_BASE_URL
        value: https://sijill-frontend.onrender.com/public/assets
